name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Theme drift check
        run: bun run theme:check

      - name: Token policy
        run: bun run tokens:check

      - name: cn keeps the type scale next to a text color
        run: bun -e 'import { cn } from "./packages/ui/src/lib/utils"; const out = cn("text-body text-title", "text-caption text-foreground"); if (out !== "text-caption text-foreground") throw new Error(out)'

      - name: Setup Node for the agent kit's network tests
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Agent kit tests
        working-directory: packages/agent
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  registry:
    name: Registry smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the registry
        run: bun run build --filter=ui

      # Install the base and every component into a fresh project, the way an
      # app outside this repo would. Items depend on each other by absolute
      # URL; point those at this build so unreleased items resolve.
      - name: Init a project from the base and add every component
        run: |
          mkdir -p "$RUNNER_TEMP/registry"
          cp -r apps/ui/out/r "$RUNNER_TEMP/registry/r"
          sed -i 's#https://ui.zyx.tw/r/\([a-z-]*\)\.json#http://localhost:8099/r/\1.json#g' "$RUNNER_TEMP"/registry/r/*.json
          (cd "$RUNNER_TEMP/registry" && python3 -m http.server 8099 > /dev/null 2>&1 &)
          for i in $(seq 1 10); do curl -sf localhost:8099/r/base.json > /dev/null && break; sleep 1; done
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          bunx shadcn@latest init http://localhost:8099/r/base.json -t next -n app --no-monorepo -y
          cd app
          grep -q '"@zyx1121": "https://ui.zyx.tw/r/{name}.json"' components.json
          grep -q -- '--text-\*: initial' app/globals.css
          grep -q -- '--text-caption: 0.875rem' app/globals.css
          grep -q 'fonts/sarasa-mono-tc.css' app/globals.css
          grep -q '@utility terminal-link' app/globals.css
          grep -q '@utility duration-overlay' app/globals.css
          ! grep -q -- '--card:' app/globals.css
          items=$(python3 -c 'import json; print(" ".join(f"http://localhost:8099/r/{i["name"]}.json" for i in json.load(open("../../registry/r/registry.json"))["items"] if i["type"] in ("registry:ui", "registry:component", "registry:block") or i["name"].startswith("agent-")))')
          bunx shadcn@latest add $items -y -o
          for file in telemetry model tools seal public-fetch; do test -f "lib/agent/$file.ts"; done
          grep -q 'from "./telemetry"' lib/agent/tools.ts
          grep -q '"@modelcontextprotocol/server"' package.json
          grep -q 'createCn' lib/utils.ts
          grep -q 'from "./corner-tip"' components/corners.tsx
          grep -q 'corner-edge' app/globals.css
          grep -q 'from "../../lib/utils"' components/ui/button.tsx
          ! grep -rq 'text-sm\|text-xs\|rounded-lg' components/ui
          grep -q 'animate-mask-reveal' app/globals.css
          cat > app/page.tsx <<'PAGE'
          "use client"
          import { BottomCorners, LegalLinks, TopCorners } from "@/components/corners"
          import { ConfirmDialog } from "@/components/confirm-dialog"
          import { EmptyState } from "@/components/empty-state"
          import { StatusPage } from "@/components/status-page"
          import { Button } from "@/components/ui/button"
          import { Dialog, DialogContent, DialogTitle, DialogTrigger } from "@/components/ui/dialog"
          import { InputGroup, InputGroupInput } from "@/components/ui/input-group"
          import { MaskReveal } from "@/components/ui/mask-reveal"
          import { Toolbar } from "@/components/ui/toolbar"

          export default function Page() {
            return (
              <main>
                <TopCorners fade nav={<a href="/">Docs</a>} />
                <BottomCorners fade links={<LegalLinks />} />
                <StatusPage title="Not found" />
                <EmptyState noun="projects" />
                <ConfirmDialog trigger={<Button>Delete</Button>} title="Delete it?" confirmLabel="Delete" onConfirm={() => {}} />
                <Toolbar><Button>Save</Button></Toolbar>
                <InputGroup><InputGroupInput /></InputGroup>
                <MaskReveal>zyx</MaskReveal>
                <Dialog>
                  <DialogTrigger render={<Button />}>Open</DialogTrigger>
                  <DialogContent><DialogTitle>Title</DialogTitle></DialogContent>
                </Dialog>
              </main>
            )
          }
          PAGE
          bun run build

  compose:
    name: compose.yaml is valid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate with the example settings
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config --services

  images:
    name: ${{ matrix.host }} image
    # The host deploys whatever :main points at, so publish only after the
    # rest of CI has passed.
    needs: [ci, registry, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            host: www.zyx.tw
            health: /llms.txt
            pages: / /works /about /privacy /terms /llms.txt /about.md /og/0.gif
          - app: ui
            host: ui.zyx.tw
            dockerfile: apps/ui/Dockerfile
            pages: / /button /button.md /index.md /llms.txt /r/base.json /fonts/sarasa-mono-tc.css
          - app: good
            host: good.zyx.tw
            pages: /
          - app: time
            host: time.zyx.tw
            pages: /
          - app: link
            host: link.zyx.tw
            pages: /
            # An unknown path is a short code, looked up in the database.
            no404: true
          - app: "1909"
            host: 1909.zyx.tw
            health: /auth/login
            pages: /auth/login
            # Every other path needs a session or the database.
            no404: true
          - app: 3d
            host: 3d.zyx.tw
            pages: /
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          docker build -f "${{ matrix.dockerfile || 'Dockerfile' }}" \
            --build-arg APP="${{ matrix.app }}" \
            --build-arg HEALTH="${{ matrix.health || '/' }}" \
            -t app:ci .

      - name: Smoke test
        run: |
          docker run -d --name app -p 127.0.0.1:3000:3000 app:ci
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:3000/ && break; sleep 1; done
          for path in ${{ matrix.pages }}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "localhost:3000$path")
            echo "$path $code"
            test "$code" = 200
          done

      - name: Smoke test (not found)
        if: ${{ !matrix.no404 }}
        run: test "$(curl -s -o /dev/null -w "%{http_code}" localhost:3000/nope-not-a-page)" = 404

      - name: Smoke test (www.zyx.tw)
        if: matrix.app == 'web'
        run: curl -s -o /dev/null -w "%{redirect_url}\n" localhost:3000/og.gif | grep -q '^https://www.zyx.tw/og/'

      - name: Smoke test (ui.zyx.tw)
        if: matrix.app == 'ui'
        run: |
          curl -sI localhost:3000/button.md | grep -qi '^content-type: text/markdown'
          curl -sI localhost:3000/r/base.json | grep -qi '^access-control-allow-origin: \*'
          test "$(curl -s -o /dev/null -w "%{http_code}" localhost:3000/button.html)" = 308
          test "$(curl -s -o /dev/null -w "%{http_code}" localhost:3000/button/)" = 308
          # Crafted paths must never redirect off the host.
          for path in /%5Cevil.com.html /%09/evil.com.html /%5Cevil.com/; do
            location=$(curl -s -o /dev/null -w "%{redirect_url}" "localhost:3000$path")
            echo "$path -> $location"
            case "$location" in ""|http://localhost:3000/*) ;; *) exit 1 ;; esac
          done

      - name: Container log on failure
        if: failure()
        run: docker logs app || true

      - name: Push the commit's image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/zyx1121/${{ matrix.host }}
          docker tag app:ci "$image:sha-${GITHUB_SHA::7}"
          docker push "$image:sha-${GITHUB_SHA::7}"

  publish:
    name: Publish :main
    # The hosts deploy :main within a minute, so move every app's :main only
    # once every image of this commit has passed: never a partial release.
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Point :main at this commit
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for host in www.zyx.tw ui.zyx.tw good.zyx.tw time.zyx.tw link.zyx.tw 1909.zyx.tw 3d.zyx.tw; do
            image=ghcr.io/zyx1121/$host
            docker buildx imagetools create -t "$image:main" "$image:sha-${GITHUB_SHA::7}"
          done
