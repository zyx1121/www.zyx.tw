name: Release CLI

on:
  push:
    tags: ["zyxui-v*"]

jobs:
  publish:
    name: Publish zyxui to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck --filter=zyxui

      - name: Build
        run: bun run build --filter=zyxui

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#zyxui-v}"
          pkg="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match package version $pkg" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
